name: FM Gifts Control Panel — Phase 2 Local Build & Test

on:
  push:
    branches:
      - feat/fm-gifts-control-panel-phase2-2026-11-02
    paths:
      - "wordpress/wp-content/plugins/fm-gifts-control/**"
      - "tests/fm-gifts-control/**"
      - ".github/workflows/fm-gifts-control-phase2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm-gifts-control-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-build-test:
    name: PHP syntax and safety checks (Android DroidRunner)
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - android
      - android-api-33
      - arm64
      - soc-spreadtrum-t820-ums9620-2h10-unisoc-t820
    timeout-minutes: 10

    steps:
      - name: Checkout Phase 2 branch only
        uses: actions/checkout@v4
        with:
          ref: feat/fm-gifts-control-panel-phase2-2026-11-02
          persist-credentials: false

      - name: Identify isolated runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "This workflow performs repository-local checks only."
          echo "No FTP, deployment, live-site requests, or external provider calls."

      - name: Diagnose Termux and PRoot visibility (read-only)
        shell: bash
        run: |
          set +e
          echo "=== Process identity and environment ==="
          id
          printf 'PATH=%s\nPREFIX=%s\nHOME=%s\n' "$PATH" "${PREFIX:-unset}" "${HOME:-unset}"
          printf 'self root: '; readlink /proc/self/root 2>&1
          printf 'self cwd: '; readlink /proc/self/cwd 2>&1
          echo
          echo "=== Relevant mount table entries ==="
          grep -Ei 'termux|/data|/storage|/usr| / ' /proc/self/mountinfo 2>&1 | head -n 100
          echo
          echo "=== Candidate Termux roots ==="
          for path in \
            /data/data/com.termux \
            /data/user/0/com.termux \
            /data/user_de/0/com.termux \
            /data/data/com.termux/files/usr \
            /data/user/0/com.termux/files/usr \
            "${PREFIX:-/__prefix_unset__}"; do
            if [ -e "$path" ]; then
              ls -ld "$path" 2>&1
              stat -c 'mode=%A uid=%u gid=%g type=%F' "$path" 2>&1
            else
              echo "NOT VISIBLE: $path"
            fi
          done
          echo
          echo "=== PHP candidate visibility and permissions ==="
          for path in \
            "$(command -v php 2>/dev/null)" \
            /data/data/com.termux/files/usr/bin/php \
            /data/user/0/com.termux/files/usr/bin/php \
            /usr/bin/php \
            /usr/local/bin/php \
            /bin/php; do
            [ -n "$path" ] || continue
            if [ -e "$path" ]; then
              ls -l "$path" 2>&1
              stat -c 'mode=%A uid=%u gid=%g size=%s' "$path" 2>&1
              readlink -f "$path" 2>&1
              command -v file >/dev/null 2>&1 && file "$path" 2>&1
              if command -v readelf >/dev/null 2>&1; then
                echo "-- ELF interpreter and dynamic dependencies for $path --"
                readelf -l "$path" 2>&1 | grep -i -A1 'interpreter' || true
                readelf -d "$path" 2>&1 | grep -E 'NEEDED|RPATH|RUNPATH' || true
              else
                echo "readelf unavailable; ELF dependencies not inspected."
              fi
            else
              echo "NOT VISIBLE: $path"
            fi
          done
          echo
          echo "=== Access checks (no files created) ==="
          for path in /data /data/data /data/data/com.termux /data/data/com.termux/files/usr/bin; do
            if [ -e "$path" ]; then
              printf '%s: ' "$path"
              [ -r "$path" ] && printf 'readable ' || printf 'not-readable '
              [ -x "$path" ] && printf 'traversable\n' || printf 'not-traversable\n'
            else
              echo "$path: absent"
            fi
          done
          echo
          echo "Read-only diagnostic complete; no package manager or filesystem writes were attempted."

      - name: Locate PHP CLI (Termux host or DroidRunner)
        id: php
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN=""
          for candidate in \
            "$(command -v php 2>/dev/null || true)" \
            "${PREFIX:-}/bin/php" \
            "/data/data/com.termux/files/usr/bin/php" \
            "/data/user/0/com.termux/files/usr/bin/php" \
            "/usr/bin/php" \
            "/usr/local/bin/php" \
            "/bin/php"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && [ ! -d "$candidate" ]; then
              PHP_BIN="$candidate"
              break
            fi
          done
          if [ -z "$PHP_BIN" ]; then
            echo "::error::PHP CLI is not visible inside the DroidRunner job. See read-only mount diagnostics above."
            echo "PHP CLI: BLOCKED — no executable found in PATH or common Termux/Linux locations." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "php_bin=$PHP_BIN" >> "$GITHUB_OUTPUT"
          "$PHP_BIN" -v
          "$PHP_BIN" -r 'printf("PHP_VERSION=%s\\n", PHP_VERSION);'

      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_DIR="wordpress/wp-content/plugins/fm-gifts-control"
          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "::error::Plugin directory is not present on this branch yet."
            echo "Plugin source: NOT READY — no PHP files to lint." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mapfile -d '' files < <(find "$PLUGIN_DIR" -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No PHP files found in plugin directory."
            exit 1
          fi
          for file in "${files[@]}"; do
            "${{ steps.php.outputs.php_bin }}" -l "$file"
          done

      - name: Verify required safety markers
        shell: bash
        run: |
          set -euo pipefail
          MAIN="wordpress/wp-content/plugins/fm-gifts-control/fm-gifts-control.php"
          test -s "$MAIN"
          grep -q "READ-ONLY PROTOTYPE" "$MAIN"
          grep -q "LOCAL / STAGING" "$MAIN"
          echo "Required local/read-only markers: PASS"

      - name: Record test result
        if: always()
        shell: bash
        run: |
          {
            echo "## FM Gifts Control Panel — Phase 2"
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: ${RUNNER_NAME:-unknown} (${RUNNER_ARCH:-unknown})"
            echo "- Scope: read-only Termux/PRoot diagnostics plus repository-local PHP syntax and safety-marker checks"
            echo "- Deployment/live-site access: NOT PART OF THIS WORKFLOW"
            echo
            echo "Full step outcomes are recorded above in this Actions run."
          } >> "$GITHUB_STEP_SUMMARY"
