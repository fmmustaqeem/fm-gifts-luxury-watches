name: Site CI + Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fm-gifts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    steps:
      - uses: actions/checkout@v4
      - name: Validate site entrypoint
        run: test -s index.html
      - name: Validate HTML structure
        run: |
          grep -q '<html' index.html
          grep -q '</html>' index.html
          grep -q '<title>' index.html
      - name: Validate storefront assets and categories
        run: |
          test -s assets/storefront.css
          test -s assets/storefront.js
          test -s data/catalog.json
          grep -q 'data-category="Watches"' index.html
          grep -q 'data-category="Fragrances"' index.html
          grep -q 'data-category="Gifts"' index.html
          grep -q 'data-category="Accessories"' index.html
          grep -q 'id="catalogue"' index.html
          grep -q 'id="searchInput"' index.html
          grep -q 'id="categoryFilter"' index.html
          grep -q 'fetch("/data/catalog.json"' assets/storefront.js
          python3 -m json.tool data/catalog.json >/dev/null

  production-gate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: production
      url: https://fm-gifts-luxury-watches.pages.dev
    steps:
      - name: Production release gate
        run: |
          echo "FM Gifts production gate passed."
          echo "Cloudflare Pages Git integration performs the production deployment."
