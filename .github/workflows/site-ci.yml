name: Site CI + Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fm-gifts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site entrypoint
        run: test -s index.html
      - name: Validate HTML structure
        run: |
          grep -q '<html' index.html
          grep -q '</html>' index.html
          grep -q '<title>' index.html
      - name: Validate core storefront sections
        run: |
          grep -q 'Shop All Products' index.html
          grep -q 'AI Shopping Assistant' index.html
          grep -q 'Watches' index.html
          grep -q 'Perfume' index.html
          grep -q 'Kids Watches' index.html

  production-gate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fm-gifts-luxury-watches.pages.dev
    steps:
      - name: Production release gate
        run: |
          echo "FM Gifts production gate passed."
          echo "Cloudflare Pages Git integration performs the production deployment."
