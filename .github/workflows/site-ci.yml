name: FM Gifts Site Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm-gifts-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    steps:
      - uses: actions/checkout@v4
      - name: Validate site entrypoint
        run: test -s index.html
      - name: Validate HTML structure
        run: |
          grep -q '<html' index.html
          grep -q '</html>' index.html
          grep -q '<title>' index.html
      - name: Validate storefront assets and catalogue
        run: |
          test -s assets/storefront.css
          test -s assets/storefront.js
          test -s data/catalog.json
          grep -q 'data-category="Watches"' index.html
          grep -q 'data-category="Fragrances"' index.html
          grep -q 'data-category="Gifts"' index.html
          grep -q 'data-category="Accessories"' index.html
          grep -q 'id="catalogue"' index.html
          grep -q 'id="searchInput"' index.html
          grep -q 'id="categoryFilter"' index.html
          grep -q 'fetch("/data/catalog.json"' assets/storefront.js
          python3 -m json.tool data/catalog.json >/dev/null
      - name: Check ByetHost deployment workflow is present
        run: test -s .github/workflows/deploy-byethost.yml
