name: Deploy FM Gifts to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to upload the reviewed static preview to the isolated ByetHost preview folder"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fm-gifts-byethost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: byethost-staging
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4

      - name: Set up Python for catalogue validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage approved static preview only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets dist/data dist/store dist/api
          cp index.html store.html policies.html dist/
          cp assets/storefront.css assets/storefront.js assets/ai-assistant.js assets/shop.js assets/cart.js assets/checkout.js dist/assets/
          cp api/ai-chat.php dist/api/
          cp store/cart.html store/checkout.html dist/store/
          # Include the previously prepared 80-item demo catalogue (20 in each category).
          # Names/SKUs remain explicitly marked DEMO; these are display/test items, not verified stock.
          cp data/catalog.json dist/data/catalog.json

          # Validate every expected file and the explicitly labelled demo catalogue.
          for file in index.html store.html policies.html assets/storefront.css assets/storefront.js assets/ai-assistant.js assets/shop.js assets/cart.js assets/checkout.js api/ai-chat.php store/cart.html store/checkout.html data/catalog.json; do
            test -s "$file"
          done
          for file in dist/index.html dist/store.html dist/policies.html dist/assets/storefront.css dist/assets/storefront.js dist/assets/ai-assistant.js dist/api/ai-chat.php dist/assets/shop.js dist/assets/cart.js dist/assets/checkout.js dist/data/catalog.json dist/store/cart.html dist/store/checkout.html; do
            test -s "$file"
          done
          python3 -m json.tool dist/data/catalog.json >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          with open("dist/data/catalog.json", encoding="utf-8") as f:
              data = json.load(f)
          products = data.get("products")
          assert data.get("status") == "demo_collection_only", "Catalogue must remain explicitly marked as demo"
          assert isinstance(products, list), "Expected a products list"
          demo = [p for p in products if str(p.get("sku", "")).startswith("DEMO-")]
          user_listings = [p for p in products if str(p.get("sku", "")).startswith("FM-")]
          assert len(demo) == 80, f"Expected 80 clearly labelled demo products, got {len(demo)}"
          counts = Counter(p.get("category") for p in demo)
          expected = {"Watches": 20, "Fragrances": 20, "Gifts": 20, "Accessories": 20}
          assert dict(counts) == expected, f"Unexpected demo category counts: {dict(counts)}"
          assert all(p.get("status") == "Active" for p in demo), "Expected all prepared demo items to be visible"
          expected_listings = {
              "FM-WALLET-COW-LONG": ("Wallets", 1500),
              "FM-WALLET-COW-MED": ("Wallets", 1200),
              "FM-WALLET-COW-SIZE": ("Wallets", 1000),
              "FM-WALLET-RESIN-CHINA": ("Wallets", 800),
              "FM-BELT-RESIN": ("Belts", None),
              "FM-BELT-COW-LEATHER": ("Belts", None),
              "FM-CUFFLINK-001": ("Cufflinks", None),
              "FM-TIE-001": ("Ties", None),
              "FM-CUFFLINK-500": ("Cufflinks", 500),
              "FM-CUFFLINK-800": ("Cufflinks", 800),
              "FM-CUFFLINK-1000": ("Cufflinks", 1000),
              "FM-LADIES-CHAIN-TRUWORTH": ("Ladies Watch Chains", 2500),
              "FM-LADIES-CHAIN-NORMAL-BRAND": ("Ladies Watch Chains", 1800),
              "FM-LADIES-CHAIN-NORMAL": ("Ladies Watch Chains", 1200),
              "FM-LADIES-CHAIN-SMALL": ("Ladies Watch Chains", 800),
              "FM-GENTS-CHAIN-LOW": ("Gents Watch Chains", 1200),
              "FM-GENTS-CHAIN-HIGH": ("Gents Watch Chains", 2000),
              "FM-GENTS-WATCH-COPY": ("Watches", 4000),
              "FM-GENTS-WATCH-ORIGINAL-5000": ("Watches", 5000),
              "FM-GENTS-WATCH-ORIGINAL-6000": ("Watches", 6000),
              "FM-GENTS-WATCH-ORIGINAL-7000": ("Watches", 7000),
              "FM-GENTS-WATCH-DOUBLE-TIME": ("Watches", 7000),
              "FM-GENTS-WATCH-CHRONOGRAPH": ("Watches", 7000),
              "FM-GENTS-WATCH-SEMI-AUTO": ("Watches", 6500),
              "FM-GENTS-WATCH-FULL-AUTO": ("Watches", 8000),
              "FM-BELT-RESIN-500": ("Belts", 500),
              "FM-BELT-2-IN-1": ("Belts", 1000),
              "FM-BELT-LEATHER-15": ("Belts", 1200),
              "FM-BELT-LEATHER-175": ("Belts", 1500),
              "FM-WALLCLOCK-REDUM-2500": ("Wall Clocks", 2500),
              "FM-WALLCLOCK-REDUM-3000": ("Wall Clocks", 3000),
              "FM-WALLCLOCK-DIGITAL": ("Wall Clocks", 3000),
              "FM-WALLCLOCK-DIGITAL-ANALOG": ("Wall Clocks", 3500),
              "FM-WALLCLOCK-BOSS": ("Wall Clocks", 2000),
              "FM-WALLCLOCK-BWC": ("Wall Clocks", 1800),
              "FM-WALLCLOCK-UNIC": ("Wall Clocks", 2200),
              "FM-WALLCLOCK-SETTO-3500": ("Wall Clocks", 3500),
              "FM-WALLCLOCK-SMALL-800": ("Wall Clocks", 800),
              "FM-WALLCLOCK-MED-1200": ("Wall Clocks", 1200),
              "FM-WALLCLOCK-MED-1500": ("Wall Clocks", 1500),
              "FM-WALLCLOCK-SETTO-4500": ("Wall Clocks", 4500),
              "FM-WALLCLOCK-SETTO-5500": ("Wall Clocks", 5500),
              "FM-ALARMCLOCK-1000": ("Alarm Clocks", 1000),
              "FM-ALARMCLOCK-1800": ("Alarm Clocks", 1800),
              "FM-ALARMCLOCK-2200": ("Alarm Clocks", 2200),
              "FM-ALARMCLOCK-2500": ("Alarm Clocks", 2500),
              "FM-ALARMCLOCK-3000": ("Alarm Clocks", 3000),
              "FM-KEYCHAIN-300": ("Keychains", 300),
              "FM-KEYCHAIN-600": ("Keychains", 600),
          }
          by_sku = {p.get("sku"): p for p in user_listings}
          assert set(by_sku) == set(expected_listings), f"Unexpected user listings: {sorted(by_sku)}"
          for sku, (category, price) in expected_listings.items():
              item = by_sku[sku]
              assert item.get("category") == category, f"Wrong category for {sku}"
              assert item.get("price") == price, f"Wrong price for {sku}"
              assert item.get("status") == "Active", f"Listing not active: {sku}"
          assert len(products) == 129, f"Expected 129 total listings (80 demo + 49 requested), got {len(products)}"
          print("Validated 80 demo items plus 49 requested listings; category and price checks passed.")
          PY

          # Paths are intentionally relative in the HTML, so the preview works under /fm-gifts-preview/.
          ! grep -R -E 'href="/|src="/' dist --include='*.html'
          grep -q 'assets/storefront.js' dist/index.html
          grep -q 'assets/ai-assistant.js' dist/index.html
          grep -q 'id="fmAiPanel"' dist/index.html
          grep -q 'assets/shop.js' dist/store.html
          grep -q '../assets/cart.js' dist/store/cart.html
          grep -q '../assets/checkout.js' dist/store/checkout.html

          # Only the explicit static allowlist is staged; no repository or WordPress files.
          test ! -e dist/.github
          test ! -e dist/wordpress
          test "$(find dist -type f | wc -l | tr -d ' ')" = "13"

      - name: Validate FTPS credentials and isolated target
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          # Refuse any upload into the live WordPress document root.
          test "$FTP_TARGET_DIR" = "htdocs/fm-gifts-preview/"

      - name: Upload staged static preview over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
