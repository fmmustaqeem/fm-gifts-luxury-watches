name: Deploy FM Gifts to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to upload the reviewed static preview to the isolated ByetHost preview folder"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fm-gifts-byethost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: byethost-staging
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4

      - name: Stage only approved static preview files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets dist/data dist/store
          cp index.html store.html policies.html dist/
          cp assets/storefront.css assets/storefront.js assets/shop.js assets/cart.js assets/checkout.js dist/assets/
          # Keep demo SKUs/prices out of any publicly reachable preview.
          printf '{\n  "schemaVersion": 1,\n  "currency": "PKR",\n  "status": "verified_inventory_required",\n  "products": []\n}\n' > dist/data/catalog.json
          cp store/cart.html store/checkout.html dist/store/
          test -s dist/index.html
          test -s dist/store.html
          test -s dist/policies.html
          test -s dist/assets/storefront.css
          test -s dist/assets/storefront.js
          test -s dist/assets/shop.js
          test -s dist/assets/cart.js
          test -s dist/assets/checkout.js
          test -s dist/data/catalog.json
          test -s dist/store/cart.html
          test -s dist/store/checkout.html
          python3 -m json.tool dist/data/catalog.json >/dev/null
          # Never include repository metadata, workflows, or WordPress code in the upload directory.
          test ! -e dist/.github
          test ! -e dist/wordpress

      - name: Validate FTPS credentials and isolated target
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          # Refuse to deploy into the live WordPress document root.
          test "$FTP_TARGET_DIR" = "htdocs/fm-gifts-preview/"

      - name: Upload staged static preview over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
