name: Deploy FM Gifts to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to upload the reviewed static preview to the isolated ByetHost preview folder"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fm-gifts-byethost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: byethost-staging
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4

      - name: Set up Python for catalogue validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage approved static preview only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/assets dist/data dist/store
          cp index.html store.html policies.html dist/
          cp assets/storefront.css assets/storefront.js assets/shop.js assets/cart.js assets/checkout.js dist/assets/
          cp store/cart.html store/checkout.html dist/store/
          # Include the previously prepared 80-item demo catalogue (20 in each category).
          # Names/SKUs remain explicitly marked DEMO; these are display/test items, not verified stock.
          cp data/catalog.json dist/data/catalog.json

          # Validate every expected file and the explicitly labelled demo catalogue.
          for file in index.html store.html policies.html assets/storefront.css assets/storefront.js assets/shop.js assets/cart.js assets/checkout.js store/cart.html store/checkout.html data/catalog.json; do
            test -s "$file"
          done
          for file in dist/index.html dist/store.html dist/policies.html dist/assets/storefront.css dist/assets/storefront.js dist/assets/shop.js dist/assets/cart.js dist/assets/checkout.js dist/data/catalog.json dist/store/cart.html dist/store/checkout.html; do
            test -s "$file"
          done
          python3 -m json.tool dist/data/catalog.json >/dev/null
          python3 - <<'PY'
          import json
          from collections import Counter
          with open("dist/data/catalog.json", encoding="utf-8") as f:
              data = json.load(f)
          products = data.get("products")
          assert data.get("status") == "demo_collection_only", "Catalogue must remain explicitly marked as demo"
          assert isinstance(products, list), "Expected a products list"
          demo = [p for p in products if str(p.get("sku", "")).startswith("DEMO-")]
          user_listings = [p for p in products if str(p.get("sku", "")).startswith("FM-")]
          assert len(demo) == 80, f"Expected 80 clearly labelled demo products, got {len(demo)}"
          counts = Counter(p.get("category") for p in demo)
          expected = {"Watches": 20, "Fragrances": 20, "Gifts": 20, "Accessories": 20}
          assert dict(counts) == expected, f"Unexpected demo category counts: {dict(counts)}"
          assert all(p.get("status") == "Active" for p in demo), "Expected all prepared demo items to be visible"
          expected_listings = {
              "FM-WALLET-COW-LONG": ("Wallets", 1500),
              "FM-WALLET-COW-MED": ("Wallets", 1200),
              "FM-WALLET-COW-SIZE": ("Wallets", 1000),
              "FM-WALLET-RESIN-CHINA": ("Wallets", 800),
              "FM-BELT-RESIN": ("Belts", None),
              "FM-BELT-COW-LEATHER": ("Belts", None),
              "FM-CUFFLINK-001": ("Cufflinks", None),
              "FM-TIE-001": ("Ties", None),
          }
          by_sku = {p.get("sku"): p for p in user_listings}
          assert set(by_sku) == set(expected_listings), f"Unexpected user listings: {sorted(by_sku)}"
          for sku, (category, price) in expected_listings.items():
              item = by_sku[sku]
              assert item.get("category") == category, f"Wrong category for {sku}"
              assert item.get("price") == price, f"Wrong price for {sku}"
              assert item.get("status") == "Active", f"Listing not active: {sku}"
          assert len(products) == 88, f"Expected 88 total listings (80 demo + 8 requested), got {len(products)}"
          print("Validated 80 demo items plus 8 requested listings; 4 wallet prices checked. Belt/cufflink/tie prices remain unset.")
          PY

          # Paths are intentionally relative in the HTML, so the preview works under /fm-gifts-preview/.
          ! grep -R -E 'href="/|src="/' dist --include='*.html'
          grep -q 'assets/storefront.js' dist/index.html
          grep -q 'assets/shop.js' dist/store.html
          grep -q '../assets/cart.js' dist/store/cart.html
          grep -q '../assets/checkout.js' dist/store/checkout.html

          # Only the explicit static allowlist is staged; no repository or WordPress files.
          test ! -e dist/.github
          test ! -e dist/wordpress
          test "$(find dist -type f | wc -l | tr -d ' ')" = "11"

      - name: Validate FTPS credentials and isolated target
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          # Refuse any upload into the live WordPress document root.
          test "$FTP_TARGET_DIR" = "htdocs/fm-gifts-preview/"

      - name: Upload staged static preview over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
