name: Deploy FM Gifts to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to upload the reviewed storefront branch to the isolated preview folder"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fm-gifts-byethost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: byethost-staging
    steps:
      - name: Checkout reviewed storefront branch
        uses: actions/checkout@v4
        with:
          ref: feat/fresh-luxury-storefront-2026-10-24
      - name: Set up Node.js for catalog validation
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static files and isolated target
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          for file in index.html store.html policies.html assets/storefront.css assets/storefront.js assets/shop.js assets/cart.js assets/checkout.js data/catalog.json store/cart.html store/checkout.html; do
            test -s "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('data/catalog.json', 'utf8'))"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          # Refuse to deploy into the live WordPress document root.
          test "$FTP_TARGET_DIR" = "htdocs/fm-gifts-preview/"
      - name: Assemble and validate isolated preview payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/assets deploy/data deploy/store
          cp index.html store.html policies.html deploy/
          cp assets/storefront.css assets/storefront.js assets/shop.js assets/cart.js assets/checkout.js deploy/assets/
          cp data/catalog.json deploy/data/
          cp store/cart.html store/checkout.html deploy/store/

          # The preview lives in a subfolder, so rewrite root-relative paths
          # to paths relative to each HTML page. The live WordPress root is untouched.
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function replaceFile(file, replacements) {
            let content = fs.readFileSync(file, 'utf8');
            for (const [from, to] of replacements) content = content.split(from).join(to);
            fs.writeFileSync(file, content);
          }
          for (const name of ['index.html', 'store.html', 'policies.html']) {
            replaceFile(path.join('deploy', name), [
              ['href="/', 'href="./'],
              ['src="/assets/', 'src="./assets/']
            ]);
          }
          for (const name of ['cart.html', 'checkout.html']) {
            replaceFile(path.join('deploy/store', name), [
              ['href="/assets/', 'href="../assets/'],
              ['src="/assets/', 'src="../assets/'],
              ['href="/store/cart.html"', 'href="./cart.html"'],
              ['href="/store/checkout.html"', 'href="./checkout.html"'],
              ['href="/store.html"', 'href="../store.html"'],
              ['href="/policies.html"', 'href="../policies.html"'],
              ['href="/"', 'href="../"']
            ]);
          }
          for (const name of ['storefront.js', 'shop.js']) {
            replaceFile(path.join('deploy/assets', name), [
              ['fetch("/data/catalog.json"', 'fetch("data/catalog.json"']
            ]);
          }
          // Do not expose WordPress admin links from the preview policy page.
          replaceFile('deploy/policies.html', [['href="./admin/"', 'href="./"']]);
          NODE

          for file in deploy/index.html deploy/store.html deploy/policies.html deploy/assets/storefront.css deploy/assets/storefront.js deploy/assets/shop.js deploy/assets/cart.js deploy/assets/checkout.js deploy/data/catalog.json deploy/store/cart.html deploy/store/checkout.html; do
            test -s "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('deploy/data/catalog.json', 'utf8'))"
          if find deploy \( -name '.git*' -o -name '.env*' \) | grep -q .; then
            echo "Unexpected private metadata in deploy payload"; exit 1
          fi
          # Ensure all referenced first-party scripts and styles exist in the staged payload.
          grep -q 'assets/shop.js' deploy/store.html
          grep -q 'assets/cart.js' deploy/store/cart.html
          grep -q 'assets/checkout.js' deploy/store/checkout.html
      - name: Upload website over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
