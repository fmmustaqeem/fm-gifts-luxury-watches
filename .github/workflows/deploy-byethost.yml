name: Deploy FM Gifts to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to upload the reviewed branch to the configured ByetHost target"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fm-gifts-byethost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: byethost-staging
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
      - name: Validate static site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/storefront.css
          test -s assets/storefront.js
          test -s data/catalog.json
          python3 -m json.tool data/catalog.json >/dev/null
          test -n "${{ secrets.BYETHOST_FTP_SERVER }}"
          test -n "${{ secrets.BYETHOST_FTP_USERNAME }}"
          test -n "${{ secrets.BYETHOST_FTP_PASSWORD }}"
          test -n "${{ secrets.BYETHOST_FTP_TARGET_DIR }}"
      - name: Upload website over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/README.md
            **/.DS_Store
            **/wrangler.toml
