name: Deploy FM Gifts to ByetHost

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to upload the reviewed storefront branch to the isolated preview folder"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fm-gifts-byethost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: [self-hosted, android, android-api-33, arm64, soc-spreadtrum-t820-ums9620-2h10-unisoc-t820]
    environment:
      name: byethost-staging
    steps:
      - name: Checkout reviewed storefront branch
        uses: actions/checkout@v4
        with:
          ref: feat/fresh-luxury-storefront-2026-10-24
      - name: Set up Node.js for catalog validation
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static files and isolated target
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/storefront.css
          test -s assets/storefront.js
          test -s data/catalog.json
          node -e "JSON.parse(require('fs').readFileSync('data/catalog.json', 'utf8'))"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          # Refuse to deploy into the live WordPress document root.
          test "$FTP_TARGET_DIR" = "htdocs/fm-gifts-preview/"
      - name: Assemble minimal public storefront
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/assets deploy/data deploy/store
          cp index.html store.html policies.html deploy/
          cp assets/storefront.css assets/storefront.js deploy/assets/
          cp data/catalog.json deploy/data/
          # Only public storefront assets are staged; repository metadata and
          # admin/API source are intentionally excluded from the FTP payload.
          if [ -d store ]; then cp -R store/. deploy/store/; fi
          test -s deploy/index.html
          test -s deploy/assets/storefront.css
          test -s deploy/assets/storefront.js
          test -s deploy/data/catalog.json
          if find deploy -name '.git*' -o -name '.env*' | grep -q .; then
            echo "Unexpected private metadata in deploy payload"; exit 1
          fi
      - name: Upload website over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ secrets.BYETHOST_FTP_TARGET_DIR }}
