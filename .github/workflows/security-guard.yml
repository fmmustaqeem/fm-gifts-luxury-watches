name: Security Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
            rc=$?
          elif [ -f package.json ]; then
            npm install --package-lock-only --ignore-scripts
            npm audit --audit-level=high
            rc=$?
          else
            echo "No npm manifest; dependency audit not applicable."
            rc=0
          fi
          exit $rc

  report-failure:
    if: failure()
    needs: security
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "AI Site Guard: security/maintenance check failed"             --body "Automated security/maintenance check failed on ${GITHUB_SHA}. Review the workflow run before making any production change."             --label "security" || true
