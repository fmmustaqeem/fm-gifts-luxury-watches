<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Tools</title><style>body{font-family:Arial;max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}.card h2{margin-top:0}label{display:block;font-weight:600;margin-top:10px}select,input{padding:9px;width:100%;box-sizing:border-box}.save{margin-top:16px;padding:10px 16px}.note{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Membership Tools</h1><p>Configure access for Free, Registered and Paid/VIP members.</p><div class="grid"><article class="card"><h2>Free Member</h2><label>Catalog access<select data-k="free_catalog"><option>Basic public catalog</option><option>Full catalog</option></select></label><label>Offers<select data-k="free_offers"><option>Standard</option><option>Member offers</option></select></label><label>Order history<select data-k="free_orders"><option>Off</option><option>On</option></select></label></article><article class="card"><h2>Registered Member</h2><label>Catalog access<select data-k="reg_catalog"><option>Full catalog</option><option>Basic public catalog</option></select></label><label>Member pricing<select data-k="reg_price"><option>On</option><option>Off</option></select></label><label>Wishlist / saved items<select data-k="reg_wishlist"><option>On</option><option>Off</option></select></label></article><article class="card"><h2>Paid / VIP Member</h2><label>Premium catalog<select data-k="vip_catalog"><option>On</option><option>Off</option></select></label><label>VIP pricing<select data-k="vip_price"><option>On</option><option>Off</option></select></label><label>Early access<select data-k="vip_early"><option>On</option><option>Off</option></select></label></article></div><button class="save" id="save">Save membership rules</button><p class="note" id="status">Browser-local configuration foundation. Authentication, billing and database enforcement are not faked.</p><script>(function(){const key="membership-rules";const els=[...document.querySelectorAll("[data-k]")];const old=JSON.parse(localStorage.getItem(key)||"{}");els.forEach(e=>{if(old[e.dataset.k])e.value=old[e.dataset.k]});document.getElementById("save").onclick=()=>{const o={};els.forEach(e=>o[e.dataset.k]=e.value);localStorage.setItem(key,JSON.stringify(o));document.getElementById("status").textContent="Membership rules saved locally at "+new Date().toLocaleString()}})();</script></body></html>
