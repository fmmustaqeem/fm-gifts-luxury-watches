<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail vs Market Price Advisor</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.advice{font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Retail Selling Price vs Market Price Advisor</h1><div class="box"><h2>Market comparison</h2><div class="grid"><label>SKU<input id="sku"></label><label>Product<input id="name"></label><label>Cost PKR<input id="cost" type="number" min="0"></label><label>Current retail price PKR<input id="retail" type="number" min="0"></label><label>Market low PKR<input id="low" type="number" min="0"></label><label>Market average PKR<input id="avg" type="number" min="0"></label><label>Market high PKR<input id="high" type="number" min="0"></label></div><button id="add">Add comparison</button><button id="run">Generate advice</button></div><div class="box"><h2>Admin Advice</h2><table><thead><tr><th>Product</th><th>Retail</th><th>Market Avg</th><th>Market Range</th><th>Margin</th><th>Advice</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Advice is a pricing signal based on entered market observations. It does not automatically change the public selling price.</p></div><script>(function(){const key="fm-retail-market-comparisons",note="fm-retail-price-advice";const $=id=>document.getElementById(id);function data(){return JSON.parse(localStorage.getItem(key)||"[]")}function advice(x){const margin=x.cost>0?((x.retail-x.cost)/x.cost*100):0;let a="Review";if(x.avg>0&&x.retail>x.avg*1.05)a="Above market — review price downward";else if(x.avg>0&&x.retail<x.avg*0.95&&x.retail>x.cost)a="Below market — review margin / possible price increase";else if(x.retail<=x.cost)a="URGENT: retail price at or below cost";else a="Within market band — monitor";return a+" | margin "+margin.toFixed(1)+"%"}function render(){const a=data();$("rows").innerHTML=a.map(x=>"<tr><td>"+x.name+"<br><small>"+x.sku+"</small></td><td>PKR "+x.retail+"</td><td>PKR "+x.avg+"</td><td>PKR "+x.low+" – "+x.high+"</td><td>"+(x.cost?((x.retail-x.cost)/x.cost*100).toFixed(1):"—")+"%</td><td class='advice'>"+advice(x)+"</td></tr>").join("")||"<tr><td colspan=6>No comparisons yet.</td></tr>"}$("add").onclick=()=>{const x={sku:$("sku").value.trim(),name:$("name").value.trim(),cost:+$("cost").value,retail:+$("retail").value,low:+$("low").value,avg:+$("avg").value,high:+$("high").value};if(!x.sku||!x.name||x.retail<=0||x.avg<=0){alert("SKU, product, retail price and market average are required.");return}const a=data();a.push(x);localStorage.setItem(key,JSON.stringify(a));$("msg")?.remove();render()};$("run").onclick=()=>{const a=data();localStorage.setItem(note,JSON.stringify(a.map(x=>({time:new Date().toLocaleString(),sku:x.sku,advice:advice(x)}))));render()};render()})();</script></body></html>
