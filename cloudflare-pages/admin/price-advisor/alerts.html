<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing Alerts</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.alert{font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Pricing Alert Center</h1><div class="box"><h2>Generate pricing alerts</h2><div class="grid"><label>SKU<input id="sku"></label><label>Product<input id="name"></label><label>Supplier cost PKR<input id="cost" type="number" min="0"></label><label>Market average PKR<input id="market" type="number" min="0"></label><label>Current retail PKR<input id="retail" type="number" min="0"></label></div><button id="add">Analyze</button><button id="clear">Clear alerts</button><p id="msg"></p></div><div class="box"><h2>Admin Alerts</h2><table><thead><tr><th>Time</th><th>Product</th><th>Signal</th><th>Details</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Alerts are private admin signals. Public prices are never changed automatically.</p></div><script>(function(){const key="fm-pricing-alerts",inbox="fm-admin-notifications";const $=id=>document.getElementById(id);function alerts(){return JSON.parse(localStorage.getItem(key)||"[]")}function notify(x){const a=JSON.parse(localStorage.getItem(inbox)||"[]");a.unshift(x);localStorage.setItem(inbox,JSON.stringify(a.slice(0,100)))}function analyze(x){const margin=x.cost>0?(x.retail-x.cost)/x.cost*100:0;let signal="Market aligned",details="";if(x.retail>x.market*1.05){signal="PRICE HIGH";details="Retail is >5% above market average."}else if(x.retail<x.market*.95&&x.retail>x.cost){signal="PRICE LOW";details="Retail is >5% below market average; margin review suggested."}else if(x.retail<=x.cost){signal="URGENT";details="Retail is at/below supplier cost."}else if(x.cost<x.market*.8){signal="CHEAP SUPPLY";details="Supplier cost is materially below market; review margin opportunity."}return {time:new Date().toLocaleString(),product:x.name+" ("+x.sku+")",signal,details,status:"Unread",cost:x.cost,market:x.market,retail:x.retail,margin:margin.toFixed(1)+"%"}}function render(){const a=alerts();$("rows").innerHTML=a.map(x=>"<tr><td>"+x.time+"</td><td>"+x.product+"</td><td class='alert'>"+x.signal+"</td><td>"+x.details+" Retail PKR "+x.retail+" / Market PKR "+x.market+" / Margin "+x.margin+"</td><td>"+x.status+"</td></tr>").join("")||"<tr><td colspan=5>No pricing alerts.</td></tr>"}$("add").onclick=()=>{const x={sku:$("sku").value.trim(),name:$("name").value.trim(),cost:+$("cost").value,market:+$("market").value,retail:+$("retail").value};if(!x.sku||!x.name||x.cost<=0||x.market<=0||x.retail<=0){$("msg").textContent="All pricing fields are required.";return}const n=analyze(x);const a=alerts();a.unshift(n);localStorage.setItem(key,JSON.stringify(a.slice(0,100)));notify({time:n.time,type:"pricing",message:n.product+": "+n.signal+" — "+n.details,status:"Unread"});$("msg").textContent="Admin notification generated.";render()};$("clear").onclick=()=>{localStorage.removeItem(key);$("msg").textContent="Pricing alerts cleared.";render()};render()})();</script></body></html>
