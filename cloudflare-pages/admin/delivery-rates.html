<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>false — Delivery Rates</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}input,select,button{padding:9px;margin:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>false — Courier Rate Matrix</h1><p>Private admin foundation. Rates are placeholders until verified with the courier.</p><div class="card"><div class="grid"><input id="courier" placeholder="Courier"><input id="area" placeholder="Area / zone"><input id="rate" type="number" placeholder="Rate PKR"><input id="weight" type="number" step=".1" placeholder="Base weight kg"><select id="mode"><option>Standard</option><option>Express</option><option>COD</option><option>B2B</option></select><button onclick="add()">Save Rate</button></div></div><div id="list"></div><script>const key="fm-delivery-rates";function get(){return JSON.parse(localStorage.getItem(key)||"[]")}function save(a){localStorage.setItem(key,JSON.stringify(a))}function render(){const a=get();document.getElementById("list").innerHTML=a.length?a.map((x,i)=>"<div class='card'><b>"+x.courier+"</b> — "+x.area+" — PKR "+x.rate+" / "+x.weight+"kg — "+x.mode+" <button onclick='del("+i+")'>Remove</button></div>").join(""):"<p>No verified rates saved.</p>"}function add(){const x={courier:document.getElementById("courier").value.trim(),area:document.getElementById("area").value.trim(),rate:+document.getElementById("rate").value,weight:+document.getElementById("weight").value||1,mode:document.getElementById("mode").value};if(!x.courier||!x.area||!x.rate){alert("Courier, area and rate required.");return}const a=get();a.push(x);save(a);render()}function del(i){const a=get();a.splice(i,1);save(a);render()}render()</script></body></html>
