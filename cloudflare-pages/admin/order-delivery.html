<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts & Luxury Watches — Delivery</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.card{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}input,select,button{padding:9px;margin:4px}.muted{color:#666}.row{display:flex;flex-wrap:wrap;gap:8px}</style></head><body><h1>FM Gifts & Luxury Watches — Order Delivery</h1><p class="muted">Private admin foundation. Courier details are local until connected to a real delivery API.</p><div id="app"></div><script>(function(){const key="fm-gifts-orders",root=document.getElementById("app");const couriers=["Bykea","Leopards","TCS","M&P","Skynet","Quick Feet","Kourier.pk","Star Delivery"];function get(){return JSON.parse(localStorage.getItem(key)||"[]")}function save(a){localStorage.setItem(key,JSON.stringify(a))}function render(){const a=get();if(!a.length){root.innerHTML="<p>No orders.</p>";return}root.innerHTML=a.map(function(o,i){return "<div class='card'><h2>"+o.id+"</h2><p><b>Customer:</b> "+o.customer.name+" · "+o.customer.phone+"</p><p><b>Address:</b> "+o.customer.address+"</p><div class='row'><select onchange='setCourier("+i+",this.value)'><option value=''>Select courier</option>"+couriers.map(function(c){return "<option "+(o.courier===c?"selected":"")+">"+c+"</option>"}).join("")+"</select><input placeholder='Tracking / AWB' value='"+(o.tracking||"")+"' onchange='setTracking("+i+",this.value)'><button onclick='whatsapp("+i+")'>WhatsApp Customer</button></div><p>Courier: <b>"+(o.courier||"Not assigned")+"</b> · Tracking: <b>"+(o.tracking||"Not set")+"</b></p></div>"}).join("")}window.setCourier=function(i,v){const a=get();a[i].courier=v;save(a);render()};window.setTracking=function(i,v){const a=get();a[i].tracking=v;save(a);render()};window.whatsapp=function(i){const o=get()[i];const msg="Order "+o.id+" — status: "+(o.status||"Pending")+". Courier: "+(o.courier||"Pending")+". Tracking: "+(o.tracking||"Pending")+". Delivery address: "+o.customer.address;location.href="https://wa.me/"+o.customer.phone.replace(/\D/g,"")+"?text="+encodeURIComponent(msg)};render()})()</script></body></html>
