<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paid / VIP Membership</title><style>body{font-family:Arial;max-width:1050px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}label{font-weight:600}input,select{width:100%;padding:10px;box-sizing:border-box;margin-top:6px}button{padding:10px 15px;margin-top:12px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Paid / VIP Membership</h1><div class="box"><h2>Plan Settings</h2><div class="grid"><div><label>Plan<select id="plan"><option>Paid Member</option><option>VIP Member</option></select></label></div><div><label>Billing cycle<select id="cycle"><option>Monthly</option><option>Quarterly</option><option>Yearly</option></select></label></div><div><label>Price (PKR)<input id="price" type="number" min="0"></label></div><div><label>Duration (days)<input id="days" type="number" min="1" value="30"></label></div></div><label><input id="auto" type="checkbox"> Auto-renew enabled</label><br><button id="save">Save plan</button><p class="muted">Payment gateway is not connected; this is the admin subscription configuration foundation.</p></div><div class="box"><h2>Subscription Record</h2><div class="grid"><div><label>Member ID<input id="mid"></label></div><div><label>Status<select id="status"><option>Pending Payment</option><option>Active</option><option>Expired</option><option>Cancelled</option></select></label></div><div><label>Expiry<input id="expiry" type="date"></label></div></div><button id="add">Save subscription</button><table><thead><tr><th>Member</th><th>Status</th><th>Expiry</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><script>(function(){const pk="fm-vip-plan",sk="fm-vip-subscriptions", $=x=>document.getElementById(x);function render(){const a=JSON.parse(localStorage.getItem(sk)||"[]");$("rows").innerHTML=a.map((x,i)=>"<tr><td>"+x.member+"</td><td>"+x.status+"</td><td>"+x.expiry+"</td><td><button onclick='window.cancelSub("+i+")'>Cancel</button></td></tr>").join("")||"<tr><td colspan=4>No subscriptions.</td></tr>"}$("save").onclick=()=>localStorage.setItem(pk,JSON.stringify({plan:$("plan").value,cycle:$("cycle").value,price:Number($("price").value||0),days:Number($("days").value||30),auto:$("auto").checked}));$("add").onclick=()=>{const a=JSON.parse(localStorage.getItem(sk)||"[]");if(!$("mid").value)return;a.push({member:$("mid").value,status:$("status").value,expiry:$("expiry").value});localStorage.setItem(sk,JSON.stringify(a));render()};window.cancelSub=i=>{const a=JSON.parse(localStorage.getItem(sk)||"[]");a[i].status="Cancelled";localStorage.setItem(sk,JSON.stringify(a));render()};render()})();</script></body></html>
