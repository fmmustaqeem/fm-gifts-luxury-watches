<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications Center</title><style>body{font-family:Arial;max-width:1050px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}label{display:block;padding:10px}button{padding:10px 15px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}.ok{padding:10px;background:#eef8ee}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Admin Notifications Center</h1><div class="box"><h2>Notification Rules</h2><div class="grid"><label><input id="expiry" type="checkbox" checked> Membership expiry</label><label><input id="renewal" type="checkbox" checked> Renewal reminder</label><label><input id="registration" type="checkbox" checked> New registration</label><label><input id="order" type="checkbox" checked> New order</label><label><input id="blocked" type="checkbox" checked> Member blocked</label><label><input id="security" type="checkbox" checked> Security alerts</label></div><button id="save">Save rules</button></div><div class="box"><h2>Notification Inbox</h2><button id="scan">Scan local events</button><button id="clear">Clear inbox</button><p id="msg">No scan run yet.</p><table><thead><tr><th>Time</th><th>Type</th><th>Message</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Browser-local notification center. Email/WhatsApp/push delivery requires a secured backend notification service.</p></div><script>(function(){const rulesKey="fm-notification-rules",inboxKey="fm-admin-notifications";const ids=["expiry","renewal","registration","order","blocked","security"],$=id=>document.getElementById(id);function load(){const r=JSON.parse(localStorage.getItem(rulesKey)||"{}");ids.forEach(i=>{if(r[i]!==undefined)$(i).checked=r[i]})}function render(){const a=JSON.parse(localStorage.getItem(inboxKey)||"[]");$("rows").innerHTML=a.map(x=>"<tr><td>"+x.time+"</td><td>"+x.type+"</td><td>"+x.message+"</td><td>"+x.status+"</td></tr>").join("")||"<tr><td colspan=4>No notifications.</td></tr>"}$("save").onclick=()=>{const r={};ids.forEach(i=>r[i]=$(i).checked);localStorage.setItem(rulesKey,JSON.stringify(r));$("msg").textContent="Notification rules saved locally."};$("scan").onclick=()=>{const r=JSON.parse(localStorage.getItem(rulesKey)||"{}"),a=JSON.parse(localStorage.getItem(inboxKey)||"[]"),now=new Date().toLocaleString(),events=[["registration","New member registration event ready for review."],["order","New order event ready for review."],["blocked","Member status/block event ready for review."],["security","Security/maintenance event ready for review."]];events.forEach(e=>{if(r[e[0]])a.unshift({time:now,type:e[0],message:e[1],status:"Unread"})});localStorage.setItem(inboxKey,JSON.stringify(a.slice(0,100)));render();$("msg").textContent="Local event scan completed."};$("clear").onclick=()=>{localStorage.removeItem(inboxKey);render();$("msg").textContent="Inbox cleared."};load();render()})();</script></body></html>
