<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Import Approval</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.ok{font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Catalog Import & Publish Approval</h1><div class="box"><h2>Authorized Source Import</h2><div class="grid"><label>SKU<input id="sku"></label><label>Product<input id="name"></label><label>Brand<input id="brand"></label><label>Category<input id="category"></label><label>Source/store<input id="source"></label><label>Image URL<input id="image"></label><label>Source URL<input id="sourceurl"></label><label>Cost PKR<input id="cost" type="number" min="0"></label></div><label>Import notes<textarea id="notes"></textarea></label><button id="save">Save as Pending Review</button></div><div class="box"><h2>Approval Queue</h2><button id="approve">Approve Selected</button><button id="reject">Reject Selected</button><button id="publish">Publish Approved</button><table><thead><tr><th></th><th>Product</th><th>SKU</th><th>Source</th><th>Cost</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Source data stays private. Only approved products can be marked published. External images/feed data must be authorized or licensed before publication.</p></div><script>(function(){const key="fm-import-queue",products="fm-products",notify="fm-admin-notifications";const $=id=>document.getElementById(id);function data(){return JSON.parse(localStorage.getItem(key)||"[]")}function render(){const a=data();$("rows").innerHTML=a.map((x,i)=>"<tr><td><input type='checkbox' data-i='"+i+"'></td><td>"+x.name+"<br><small>"+x.brand+" / "+x.category+"</small></td><td>"+x.sku+"</td><td>"+x.source+"</td><td>PKR "+x.cost+"</td><td>"+x.status+"</td></tr>").join("")||"<tr><td colspan=6>No pending imports.</td></tr>"}function selected(){return [...document.querySelectorAll('[data-i]:checked')].map(e=>+e.dataset.i)}function log(msg){const a=JSON.parse(localStorage.getItem(notify)||"[]");a.unshift({time:new Date().toLocaleString(),type:"catalog",message:msg,status:"Unread"});localStorage.setItem(notify,JSON.stringify(a.slice(0,100)))}$("save").onclick=()=>{const x={sku:$("sku").value.trim(),name:$("name").value.trim(),brand:$("brand").value.trim(),category:$("category").value.trim(),source:$("source").value.trim(),image:$("image").value.trim(),sourceurl:$("sourceurl").value.trim(),cost:+$("cost").value,notes:$("notes").value.trim(),status:"Pending Review",time:new Date().toISOString()};if(!x.sku||!x.name||!x.source||x.cost<=0){alert("SKU, product, source and cost are required.");return}const a=data();a.push(x);localStorage.setItem(key,JSON.stringify(a));log("Catalog import pending review: "+x.name+" ("+x.sku+")");render()};function setStatus(s){const a=data();selected().forEach(i=>a[i].status=s);localStorage.setItem(key,JSON.stringify(a));log("Catalog approval action: "+s+" on "+selected().length+" item(s).");render()}$("approve").onclick=()=>setStatus("Approved");$("reject").onclick=()=>setStatus("Rejected");$("publish").onclick=()=>{const a=data(),p=JSON.parse(localStorage.getItem(products)||"[]");selected().forEach(i=>{if(a[i]&&a[i].status==="Approved"){p.push({name:a[i].name,brand:a[i].brand,sku:a[i].sku,category:a[i].category,price:Math.round(a[i].cost*1.4),cost:a[i].cost,status:"Active",image:a[i].image,source:a[i].source});a[i].status="Published"}});localStorage.setItem(products,JSON.stringify(p));localStorage.setItem(key,JSON.stringify(a));log("Approved catalog products published to local catalog.");render()};render()})();</script></body></html>
