<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Lifecycle</title><style>body{font-family:Arial;max-width:1050px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}input,select{padding:10px;width:100%;box-sizing:border-box;margin-top:6px}button{padding:10px 15px;margin:8px 8px 0 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Membership Lifecycle</h1><div class="box"><h2>Expiry & Fallback Policy</h2><div class="grid"><div><label>Expired Paid/VIP fallback<select id="fallback"><option>Registered</option><option>Free</option></select></label></div><div><label>Reminder days before expiry<input id="reminder" type="number" min="0" value="7"></label></div><div><label>Grace period (days)<input id="grace" type="number" min="0" value="0"></label></div></div><label><input id="auto" type="checkbox" checked> Enable expiry check</label><br><label><input id="renew" type="checkbox" checked> Enable renewal reminder flag</label><br><button id="save">Save lifecycle policy</button></div><div class="box"><h2>Subscription Checker</h2><button id="check">Run expiry check</button><p id="result">Not checked.</p><table><thead><tr><th>Member</th><th>Status</th><th>Expiry</th><th>Result</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">This browser-local checker prepares lifecycle logic. Production enforcement and notifications require authenticated backend/database jobs.</p></div><script>(function(){const pk="fm-membership-lifecycle",sk="fm-vip-subscriptions",$=x=>document.getElementById(x);function load(){const p=JSON.parse(localStorage.getItem(pk)||"{}");if(p.fallback)$("fallback").value=p.fallback;if(p.reminder!=null)$("reminder").value=p.reminder;if(p.grace!=null)$("grace").value=p.grace;if(p.auto!=null)$("auto").checked=p.auto;if(p.renew!=null)$("renew").checked=p.renew}$("save").onclick=()=>{localStorage.setItem(pk,JSON.stringify({fallback:$("fallback").value,reminder:Number($("reminder").value||0),grace:Number($("grace").value||0),auto:$("auto").checked,renew:$("renew").checked}));$("result").textContent="Lifecycle policy saved locally."};$("check").onclick=()=>{const a=JSON.parse(localStorage.getItem(sk)||"[]"),now=new Date(),rows=[];for(const x of a){let result="Active";if(x.expiry){const d=new Date(x.expiry+"T23:59:59");if(d<now){x.status="Expired";result="Expired → "+$("fallback").value}else{const days=Math.ceil((d-now)/86400000);if(days<=Number($("reminder").value||0))result="Renewal reminder due ("+days+"d)"}}rows.push("<tr><td>"+x.member+"</td><td>"+x.status+"</td><td>"+(x.expiry||"—")+"</td><td>"+result+"</td></tr>")}localStorage.setItem(sk,JSON.stringify(a));$("rows").innerHTML=rows.join("")||"<tr><td colspan=4>No subscriptions.</td></tr>";$("result").textContent="Expiry check completed locally."};load()})();</script></body></html>
