<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts & Luxury Watches — Orders</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.order{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}select,button{padding:9px}.muted{color:#666}.total{font-weight:bold}</style></head><body><h1>FM Gifts & Luxury Watches — Orders</h1><p class="muted">Private admin foundation. Orders are currently stored in browser-local storage.</p><div id="orders"></div><script>(function(){const key="fm-gifts-orders",root=document.getElementById("orders");function get(){return JSON.parse(localStorage.getItem(key)||"[]")}function save(a){localStorage.setItem(key,JSON.stringify(a))}function render(){const a=get();if(!a.length){root.innerHTML="<p>No orders yet.</p>";return}root.innerHTML=a.map(function(o,i){const total=o.items.reduce(function(s,x){return s+x.price*x.qty},0);return "<article class='order'><h2>"+o.id+"</h2><p><b>Customer:</b> "+o.customer.name+" · "+o.customer.phone+"</p><p><b>Address:</b> "+o.customer.address+"</p><p><b>Created:</b> "+o.createdAt+"</p><ul>"+o.items.map(function(x){return "<li>"+x.name+" — "+x.sku+" × "+x.qty+" = PKR "+(x.price*x.qty)+"</li>"}).join("")+"</ul><p class='total'>Total: PKR "+total+"</p><div class='tools'><select onchange='changeStatus("+i+",this.value)'><option>Pending</option><option "+(o.status==="Confirmed"?"selected":"")+">Confirmed</option><option "+(o.status==="Processing"?"selected":"")+">Processing</option><option "+(o.status==="Shipped"?"selected":"")+">Shipped</option><option "+(o.status==="Delivered"?"selected":"")+">Delivered</option><option "+(o.status==="Cancelled"?"selected":"")+">Cancelled</option></select><button onclick='archiveOrder("+i+")'>Archive</button></div></article>"}).join("")}window.changeStatus=function(i,v){const a=get();a[i].status=v;save(a);render()};window.archiveOrder=function(i){const a=get();a.splice(i,1);save(a);render()};render()})()</script></body></html>
