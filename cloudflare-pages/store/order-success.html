<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Gifts &amp; Luxury Watches — Order Tracking Preview</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:auto;padding:24px;color:#211d16}
.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}
input,button{padding:11px;margin:4px}
#status{font-size:20px;font-weight:700}.muted{color:#666}
.notice{padding:12px;border:1px solid #c8a45d;border-radius:8px;background:#fff9e9}
</style>
</head>
<body>
<h1>FM Gifts &amp; Luxury Watches — Order Tracking</h1>
<p class="notice">Preview only. This page checks browser-local demo data, not a live order system.</p>
<div class="box">
<label for="orderId">Order ID</label>
<input id="orderId" autocomplete="off" maxlength="100" placeholder="Order ID">
<button id="trackButton" type="button">Track Order</button>
</div>
<div id="result" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  const idInput=document.getElementById('orderId');
  const result=document.getElementById('result');
  function node(tag,className,text){
    const el=document.createElement(tag);
    if(className)el.className=className;
    if(text!==undefined)el.textContent=String(text);
    return el;
  }
  function readOrders(){
    try{
      const value=JSON.parse(localStorage.getItem('fm-gifts-orders')||'[]');
      return Array.isArray(value)?value:[];
    }catch(error){return [];}
  }
  function addDetail(parent,label,value){
    const p=node('p','');
    p.append(node('strong','',label+': '),document.createTextNode(String(value||'Pending')));
    parent.append(p);
  }
  function track(){
    const id=idInput.value.trim();
    result.replaceChildren();
    if(!id){result.append(node('div','box','Enter an order ID to search this browser’s demo records.'));return;}
    const order=readOrders().find(item=>item&&String(item.id||'')===id);
    if(!order){result.append(node('div','box','Order not found in this browser’s demo records.'));return;}
    const box=node('div','box');
    box.append(node('h2','',order.id||'Order'));
    box.append(node('p','', 'Preview status: '+String(order.status||'Pending')));
    const delivery=order.delivery&&typeof order.delivery==='object'?order.delivery:{};
    const customer=order.customer&&typeof order.customer==='object'?order.customer:{};
    addDetail(box,'Courier',delivery.courier||order.courier);
    addDetail(box,'Tracking',delivery.tracking||order.tracking);
    addDetail(box,'Delivery address',customer.area||customer.address);
    addDetail(box,'Created',order.createdAt);
    box.append(node('p','muted','Local demo record only; this is not verified server-side tracking.'));
    result.append(box);
  }
  document.getElementById('trackButton').addEventListener('click',track);
  idInput.addEventListener('keydown',event=>{if(event.key==='Enter')track();});
}());
</script>
</body>
</html>
