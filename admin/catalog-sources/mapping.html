<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Source Mapping</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Catalog Import & Supplier Source Mapping</h1><div class="box"><h2>Map product to private source</h2><div class="grid"><label>SKU<input id="sku"></label><label>Product<input id="name"></label><label>Supplier/Store<input id="source"></label><label>Source URL<input id="url"></label><label>Supplier cost PKR<input id="cost" type="number" min="0"></label><label>Source type<select id="type"><option>Supplier</option><option>Wholesaler</option><option>Reseller</option><option>Affiliate</option></select></label></div><button id="save">Save Mapping</button><button id="scan">Compare Mappings</button><p id="msg"></p></div><div class="box"><h2>Private Source Map</h2><table><thead><tr><th>SKU</th><th>Product</th><th>Source</th><th>Type</th><th>Cost</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Source/store records remain admin-only. Public storefront receives product/catalog data only after an explicit publish step.</p></div><script>(function(){const key="fm-catalog-source-map",notify="fm-admin-notifications";const $=id=>document.getElementById(id);function data(){return JSON.parse(localStorage.getItem(key)||"[]")}function render(){const a=data();$("rows").innerHTML=a.map(x=>"<tr><td>"+x.sku+"</td><td>"+x.name+"</td><td>"+x.source+"</td><td>"+x.type+"</td><td>PKR "+x.cost+"</td><td>"+(x.cost>0?"Mapped":"Needs cost")+"</td></tr>").join("")||"<tr><td colspan=6>No mappings yet.</td></tr>"}$("save").onclick=()=>{const x={sku:$("sku").value.trim(),name:$("name").value.trim(),source:$("source").value.trim(),url:$("url").value.trim(),cost:+$("cost").value,type:$("type").value,time:new Date().toISOString()};if(!x.sku||!x.name||!x.source||x.cost<=0){$("msg").textContent="SKU, product, source and valid supplier cost are required.";return}const a=data();const i=a.findIndex(y=>y.sku===x.sku&&y.source===x.source);if(i>=0)a[i]=x;else a.push(x);localStorage.setItem(key,JSON.stringify(a));$("msg").textContent="Private source mapping saved.";render()};$("scan").onclick=()=>{const a=data(),g={};a.forEach(x=>(g[x.sku]??=[]).push(x));const n=JSON.parse(localStorage.getItem(notify)||"[]");Object.entries(g).forEach(([sku,v])=>{if(v.length>1){v.sort((a,b)=>a.cost-b.cost);n.unshift({time:new Date().toLocaleString(),type:"source-price",message:v[0].name+" ("+sku+"): cheapest mapped source "+v[0].source+" at PKR "+v[0].cost,status:"Unread"})}});localStorage.setItem(notify,JSON.stringify(n.slice(0,100)));$("msg").textContent="Source comparison complete; cheapest-source alerts added to Admin Notifications.";render()};render()})();</script></body></html>
