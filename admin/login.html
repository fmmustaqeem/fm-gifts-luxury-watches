<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin sign in | FM Gifts</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f4ef;color:#24221f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,420px);background:#fff;border:1px solid #e7e1d6;border-radius:18px;padding:28px;box-shadow:0 18px 50px #30271912}
h1{font-size:1.55rem;margin:0 0 8px}p{color:#625e56;line-height:1.5}label{display:block;font-weight:650;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cfc8bc;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#24221f;color:#fff;font:inherit;font-weight:700}#message{min-height:1.5em;color:#9b2c2c}
</style></head>
<body><main><h1>FM Gifts Admin</h1><p>Sign in with an authorized administrator account. Customer accounts cannot open the admin area.</p>
<form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required><button type="submit">Sign in</button><p id="message" role="status" aria-live="polite"></p></form></main>
<script>
const form=document.getElementById("login-form"),message=document.getElementById("message");
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="Checking credentials…";const button=form.querySelector("button");button.disabled=true;try{const response=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:form.email.value,password:form.password.value})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok){message.textContent=data.error||"Sign-in failed.";return}const requested=new URLSearchParams(location.search).get("next")||"/admin/";const next=requested.startsWith("/admin/")&&!requested.startsWith("/admin/login.html")?requested:"/admin/";location.replace(next)}catch{message.textContent="Could not contact the sign-in service."}finally{button.disabled=false}});
if(new URLSearchParams(location.search).has("error"))message.textContent="An active administrator account is required.";
</script></body></html>
