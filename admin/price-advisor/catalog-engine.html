<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Pricing Engine</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.alert{font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Catalog Pricing Engine</h1><div class="box"><h2>Catalog product pricing</h2><div class="grid"><label>SKU<input id="sku"></label><label>Product<input id="name"></label><label>Supplier cost PKR<input id="cost" type="number" min="0"></label><label>Market average PKR<input id="market" type="number" min="0"></label><label>Current retail PKR<input id="retail" type="number" min="0"></label></div><button id="save">Save & Analyze</button><button id="run">Analyze Catalog</button><p id="msg"></p></div><div class="box"><h2>Catalog pricing report</h2><table><thead><tr><th>Product/SKU</th><th>Cost</th><th>40% Retail</th><th>20% Resale</th><th>Market</th><th>Current Retail</th><th>Signal</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">This engine reads the local admin product catalog and pricing observations. It creates admin signals only; public prices are not auto-published.</p></div><script>(function(){const pk="fm-products",ck="fm-catalog-price-inputs",ak="fm-admin-notifications";const $=id=>document.getElementById(id);function products(){return JSON.parse(localStorage.getItem(pk)||"[]")}function inputs(){return JSON.parse(localStorage.getItem(ck)||"{}")}function saveInputs(a){localStorage.setItem(ck,JSON.stringify(a))}function analyze(x,i){const cost=+x.cost||0,market=+i.market||0,retail=+x.price||0,r40=cost*1.4,r20=cost*1.2;let signal="MARKET ALIGNED";if(retail<=cost&&retail>0)signal="URGENT: RETAIL ≤ COST";else if(market>0&&retail>market*1.05)signal="PRICE HIGH";else if(market>0&&retail<market*.95)signal="PRICE LOW";else if(cost>0&&market>cost*1.5)signal="CHEAP SUPPLY OPPORTUNITY";return {sku:x.sku,name:x.name,cost,r40,r20,market,retail,signal}}function render(){const a=products(),inp=inputs();$("rows").innerHTML=a.map(x=>{const r=analyze(x,inp[x.sku]||{});return "<tr><td>"+r.name+"<br><small>"+r.sku+"</small></td><td>PKR "+r.cost+"</td><td>PKR "+r.r40.toFixed(0)+"</td><td>PKR "+r.r20.toFixed(0)+"</td><td>PKR "+(r.market||"—")+"</td><td>PKR "+r.retail+"</td><td class='alert'>"+r.signal+"</td></tr>"}).join("")||"<tr><td colspan=7>No catalog products yet.</td></tr>"}function run(){const a=products(),inp=inputs(),notes=JSON.parse(localStorage.getItem(ak)||"[]");a.forEach(x=>{const r=analyze(x,inp[x.sku]||{});if(r.signal!=="MARKET ALIGNED"){notes.unshift({time:new Date().toLocaleString(),type:"catalog-pricing",message:r.name+" ("+r.sku+"): "+r.signal+" | retail PKR "+r.retail+" | market PKR "+(r.market||"—"),status:"Unread"})}});localStorage.setItem(ak,JSON.stringify(notes.slice(0,100)));$("msg").textContent="Catalog pricing analysis completed and relevant admin alerts generated.";render()}$("save").onclick=()=>{const sku=$("sku").value.trim(),name=$("name").value.trim(),cost=+$("cost").value,market=+$("market").value,retail=+$("retail").value;if(!sku||!name||cost<=0){$("msg").textContent="SKU, product and supplier cost are required.";return}const a=products();const i=a.findIndex(x=>x.sku===sku);const p={name,sku,price:retail,cost};if(i>=0)a[i]={...a[i],...p};else a.push(p);localStorage.setItem(pk,JSON.stringify(a));const m=inputs();m[sku]={market};saveInputs(m);$("msg").textContent="Catalog product pricing saved locally.";render()};$("run").onclick=run;render()})();</script></body></html>
