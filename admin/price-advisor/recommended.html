<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recommended Selling Price</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.strong{font-weight:bold}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Recommended Selling Price Advisor</h1><div class="box"><h2>Pricing Inputs</h2><div class="grid"><label>SKU<input id="sku"></label><label>Product<input id="name"></label><label>Cheapest supplier cost PKR<input id="cost" type="number" min="0"></label><label>Market average PKR<input id="market" type="number" min="0"></label><label>Retail margin %<input id="margin" type="number" min="0" value="40"></label><label>B2B/resale margin %<input id="b2b" type="number" min="0" value="20"></label></div><button id="add">Calculate & Save Advice</button><button id="clear">Clear</button></div><div class="box"><h2>Admin Recommendations</h2><table><thead><tr><th>Product</th><th>Supplier Cost</th><th>+40% Retail</th><th>+20% Resale/B2B</th><th>Market Avg</th><th>Recommended Retail</th><th>Advice</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Recommendation is an admin pricing signal only. It does not automatically publish or change customer-facing prices.</p></div><script>(function(){const key="fm-recommended-price-advice";const $=id=>document.getElementById(id);function data(){return JSON.parse(localStorage.getItem(key)||"[]")}function rec(x){const retail=x.cost*(1+x.margin/100),b2b=x.cost*(1+x.b2b/100),market=x.market;let recommended=retail,advice="Use retail-margin price";if(market>0){const lower=market*.95,upper=market*1.05;if(retail>upper) {recommended=Math.max(b2b,Math.min(retail,market));advice="Market below margin price — review downward";}else if(retail<lower) {recommended=retail;advice="Market supports higher price — review upward";}else advice="Retail margin price aligned with market";}return {retail,b2b,recommended,advice}}function render(){const a=data();$("rows").innerHTML=a.map(x=>{const r=rec(x);return "<tr><td>"+x.name+"<br><small>"+x.sku+"</small></td><td>PKR "+x.cost+"</td><td>PKR "+r.retail.toFixed(0)+"</td><td>PKR "+r.b2b.toFixed(0)+"</td><td>PKR "+x.market+"</td><td class='strong'>PKR "+r.recommended.toFixed(0)+"</td><td>"+r.advice+"</td></tr>"}).join("")||"<tr><td colspan=7>No pricing advice yet.</td></tr>"}$("add").onclick=()=>{const x={sku:$("sku").value.trim(),name:$("name").value.trim(),cost:+$("cost").value,market:+$("market").value,margin:+$("margin").value,b2b:+$("b2b").value};if(!x.sku||!x.name||x.cost<=0){alert("SKU, product and supplier cost are required.");return}const a=data();a.unshift({...x,time:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(a.slice(0,200)));render()};$("clear").onclick=()=>{["sku","name","cost","market"].forEach(i=>$(i).value="");render()};render()})();</script></body></html>
