<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Gifts Admin | Source Stores</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#222;color:#fff;padding:18px 5%}main{max-width:1200px;margin:auto;padding:24px 5%}
.card{background:#fff;border:1px solid #ddd;padding:18px;margin-bottom:16px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
h1,h2,h3{margin-top:0}.tag{display:inline-block;background:#fff1eb;color:#f85606;padding:5px 8px;font-size:12px}
.meta{color:#666;font-size:13px;line-height:1.7}.product{border-top:1px solid #eee;padding:12px 0}
.price{font-weight:700;color:#f85606}
.notice{background:#fff8e8;border:1px solid #f0d99a;padding:12px;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<script src="../data/store-feed.js"></script>
</head>
<body>
<header><strong>FM Gifts — Admin</strong></header>
<main>
<div class="notice"><b>Internal source data:</b> reseller/wholesaler/supplier records, source cost and FM margin are for admin use only and are not rendered on the public storefront.</div>
<h1>Source Stores</h1>
<div id="stores"></div>
</main>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
const money=n=>Number.isFinite(Number(n))?Math.ceil(Number(n)*1.2).toLocaleString()+" PKR":"Pending";
const root=document.getElementById("stores");
root.innerHTML=FM_STORE_FEED.length?FM_STORE_FEED.map(st=>`
<section class="card">
<span class="tag">${esc(st.role)}</span>
<h2>${esc(st.name)}</h2>
<div class="meta">${esc(st.area||st.city||"Karachi")}<br>${esc(st.address||"")}<br>Phone: ${esc(st.phone||"")}<br>WhatsApp: ${esc(st.whatsapp||"")}<br>Status: ${st.verified?"Verified":"Pending verification"}</div>
<h3>Source Products</h3>
${(st.products||[]).map(p=>`<div class="product"><b>${esc(p.name)}</b><div class="meta">${esc(p.category)} • ${esc(p.subcategory||"")} • ${esc(p.brand||"")}</div><div>Source cost: <b>${p.sourcePrice==null?"Pending":esc(Number(p.sourcePrice).toLocaleString()+" PKR")}</b> &nbsp; Customer price: <span class="price">${money(p.sourcePrice)}</span> &nbsp; FM margin: 20%</div></div>`).join("")}
</section>`).join(""):"<div class='card'>No source stores recorded yet.</div>";
</script>
</body>
</html>
