<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Media Manager</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,select{width:100%;box-sizing:border-box;padding:9px;margin-top:5px}button{padding:9px 14px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}img{max-width:90px;max-height:70px}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Product Media Manager</h1><div class="box"><h2>Attach media to SKU</h2><div class="grid"><label>SKU<input id="sku"></label><label>Media type<select id="type"><option>Image</option><option>Video</option><option>PDF</option><option>Excel</option><option>Word</option></select></label><label>Media URL<input id="url"></label><label>Alt text<input id="alt"></label></div><button id="add">Add Media</button><p id="msg"></p></div><div class="box"><h2>Product Gallery / Media Registry</h2><table><thead><tr><th>SKU</th><th>Type</th><th>Preview</th><th>URL</th><th>Alt</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">This registers media URLs and provides an image preview. Secure upload/storage, MIME validation, malware scanning and CDN delivery require backend storage before production use.</p></div><script>(function(){const key="fm-product-media";const $=id=>document.getElementById(id);function data(){return JSON.parse(localStorage.getItem(key)||"[]")}function render(){const a=data();$("rows").innerHTML=a.map((x,i)=>"<tr><td>"+x.sku+"</td><td>"+x.type+"</td><td>"+(x.type==="Image"&&x.url?"<img src='"+x.url+"' alt='"+x.alt+"'>":"—")+"</td><td><a href='"+x.url+"' target='_blank' rel='noopener'>Open</a></td><td>"+x.alt+"</td><td><button onclick='window.delM("+i+")'>Delete</button></td></tr>").join("")||"<tr><td colspan=6>No media mapped.</td></tr>"}window.delM=i=>{const a=data();a.splice(i,1);localStorage.setItem(key,JSON.stringify(a));render()};$("add").onclick=()=>{const x={sku:$("sku").value.trim(),type:$("type").value,url:$("url").value.trim(),alt:$("alt").value.trim(),time:new Date().toISOString()};if(!x.sku||!x.url){$("msg").textContent="SKU and media URL are required.";return}if(x.type==="Image"&&!/^https?:\/\//i.test(x.url)){$("msg").textContent="Image URL must be http/https.";return}const a=data();a.push(x);localStorage.setItem(key,JSON.stringify(a));$("msg").textContent="Media mapped locally.";render()};render()})();</script></body></html>
