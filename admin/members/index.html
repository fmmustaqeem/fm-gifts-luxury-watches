<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Management</title><style>body{font-family:Arial;max-width:1050px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,select{width:100%;padding:10px;box-sizing:border-box;margin-top:6px}button{padding:10px 15px;margin:6px 6px 0 0}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.muted{color:#666;font-size:13px}</style></head><body><p><a href="/admin/tools/">← Admin Tools</a></p><h1>Member Management</h1><p>Registration status, tier and block/unblock controls.</p><div class="box"><div class="grid"><div><label>Member name<input id="name"></label></div><div><label>Email / Member ID<input id="id"></label></div><div><label>Tier<select id="tier"><option>Free</option><option>Registered</option><option>Paid / VIP</option></select></label></div><div><label>Status<select id="status"><option>Active</option><option>Blocked</option><option>Pending</option></select></label></div></div><button id="save">Save member</button><button id="clear">Clear</button><p class="muted">Local admin foundation only. Production authentication, database and payment verification must be connected before access is enforced.</p></div><div class="box"><h2>Members</h2><table><thead><tr><th>Name</th><th>ID</th><th>Tier</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><script>(function(){const key="fm-members";const $=x=>document.getElementById(x);let edit=-1;function data(){return JSON.parse(localStorage.getItem(key)||"[]")}function save(a){localStorage.setItem(key,JSON.stringify(a));render()}function render(){const a=data();$("rows").innerHTML=a.map((x,i)=>"<tr><td>"+x.name+"</td><td>"+x.id+"</td><td>"+x.tier+"</td><td>"+x.status+"</td><td><button onclick='window.fmEdit("+i+")'>Edit</button><button onclick='window.fmToggle("+i+")'>"+(x.status==="Blocked"?"Unblock":"Block")+"</button></td></tr>").join("")||"<tr><td colspan=5>No members.</td></tr>"}window.fmEdit=i=>{const x=data()[i];edit=i;$("name").value=x.name;$("id").value=x.id;$("tier").value=x.tier;$("status").value=x.status};window.fmToggle=i=>{const a=data();a[i].status=a[i].status==="Blocked"?"Active":"Blocked";save(a)};$("save").onclick=()=>{const a=data(),x={name:$("name").value.trim(),id:$("id").value.trim(),tier:$("tier").value,status:$("status").value};if(!x.name||!x.id)return;if(edit<0)a.push(x);else a[edit]=x;edit=-1;save(a);$("clear").click()};$("clear").onclick=()=>{edit=-1;["name","id"].forEach(k=>$(k).value="");$("tier").value="Free";$("status").value="Active"};render()})();</script></body></html>
