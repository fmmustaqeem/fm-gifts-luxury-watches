<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts & Luxury Watches — Order Tracking</title><style>body{font-family:Arial;max-width:850px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}input,button{padding:11px;margin:4px}#status{font-size:20px;font-weight:700}.muted{color:#666}</style></head><body><h1>FM Gifts & Luxury Watches — Order Tracking</h1><div class="box"><input id="id" placeholder="Order ID"><button onclick="track()">Track Order</button></div><div id="result"></div><script>function track(){const id=document.getElementById("id").value.trim(),orders=JSON.parse(localStorage.getItem("fm-gifts-orders")||"[]"),o=orders.find(x=>x.id===id),r=document.getElementById("result");if(!o){r.innerHTML="<div class='box'>Order not found.</div>";return}r.innerHTML="<div class='box'><h2>"+o.id+"</h2><p id='status'>"+(o.status||"Pending")+"</p><p><b>Courier:</b> "+(o.delivery&&o.delivery.courier||o.courier||"Pending assignment")+"</p><p><b>Tracking:</b> "+(o.delivery&&o.delivery.tracking||o.tracking||"Pending")+"</p><p><b>Delivery:</b> "+(o.customer.area||o.customer.address)+"</p><p class='muted'>Created "+o.createdAt+"</p></div>"}</script></body></html>
