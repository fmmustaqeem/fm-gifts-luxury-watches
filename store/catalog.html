<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts Shop</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{border:1px solid #ddd;border-radius:12px;padding:14px}.card img{width:100%;height:170px;object-fit:contain}.price{font-weight:bold;font-size:18px}.muted{color:#666}</style></head><body><p><a href="/store/">← Store</a></p><h1>FM Gifts & Luxury Watches</h1><div id="grid" class="grid"></div><script>(function(){const p=JSON.parse(localStorage.getItem("fm-products")||"[]"),m=JSON.parse(localStorage.getItem("fm-product-media")||"[]"),g=document.getElementById("grid");g.innerHTML=p.filter(x=>x.status==="Active").map(x=>{const im=m.find(y=>y.sku===x.sku&&y.type==="Image");return "<article class='card'>"+(im?"<img src='"+im.url+"' alt='"+(im.alt||x.name)+"'>":"<div class='muted'>No image</div>")+"<h2>"+x.name+"</h2><p>"+(x.brand||"")+" · "+(x.category||"")+"</p><p class='price'>PKR "+x.price+"</p><button onclick='alert("Buy Now: "+x.sku+"")'>Buy Now</button></article>"}).join("")||"<p>No approved active products published yet.</p>"})()</script></body></html>
