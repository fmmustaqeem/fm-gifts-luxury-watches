<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts & Luxury Watches — Cart</title><style>body{font-family:Arial;max-width:1000px;margin:auto;padding:24px}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:12px 0}.box{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:18px}input{padding:9px;width:90px}button{padding:9px 14px;margin:4px}.total{font-size:20px;font-weight:bold}@media(max-width:650px){.row{grid-template-columns:1fr 1fr}} </style></head><body><p><a href="/shop/catalog.html">← Catalog</a></p><h1>FM Gifts & Luxury Watches Cart</h1><div id="cart"></div><div class="box"><h2>Checkout</h2><div><input id="name" placeholder="Name"><input id="phone" placeholder="WhatsApp/Phone"><input id="address" placeholder="Delivery address" style="width:240px"></div><p>Payment: Cash on Delivery foundation</p><button onclick="checkout()">Place Order</button><p id="msg"></p></div><script>(function(){const key="fm-cart";function get(){return JSON.parse(localStorage.getItem(key)||"[]")}function save(a){localStorage.setItem(key,JSON.stringify(a))}function render(){const a=get(),root=document.getElementById("cart");if(!a.length){root.innerHTML="<p>Your cart is empty.</p>";return}let total=0;root.innerHTML=a.map((x,i)=>{const sub=x.price*x.qty;total+=sub;return "<div class='row'><div><b>"+x.name+"</b><br>SKU: "+x.sku+"</div><div>PKR "+x.price+"</div><div><input type='number' min='1' value='"+x.qty+"' onchange='qty("+i+",this.value)'></div><div>PKR "+sub+" <button onclick='del("+i+")'>Remove</button></div></div>"}).join("")+"<div class='box total'>Subtotal: PKR "+total+"</div>"}window.qty=(i,v)=>{const a=get();a[i].qty=Math.max(1,parseInt(v)||1);save(a);render()};window.del=i=>{const a=get();a.splice(i,1);save(a);render()};window.checkout=()=>{const a=get();if(!a.length){document.getElementById("msg").textContent="Cart is empty.";return}const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim();if(!name||!phone||!address){document.getElementById("msg").textContent="Name, phone and address are required.";return}const order={id:"ORD-"+Date.now(),customer:{name,phone,address},items:a,createdAt:new Date().toISOString(),status:"Pending"};localStorage.setItem("fm-orders",JSON.stringify([order,...JSON.parse(localStorage.getItem("fm-orders")||"[]")]));save([]);render();document.getElementById("msg").textContent="Order "+order.id+" created locally for admin review."};render()})()</script></body></html>
