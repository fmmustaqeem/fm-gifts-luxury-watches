<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts & Luxury Watches — Checkout</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:24px}.box{border:1px solid #ddd;border-radius:12px;padding:16px;margin:14px 0}input,select,button{padding:10px;margin:4px;width:95%}.total{font-size:21px;font-weight:700}.muted{color:#666}</style></head><body><h1>FM Gifts & Luxury Watches — Checkout</h1><div class="box"><input id="name" placeholder="Name"><input id="phone" placeholder="WhatsApp / Phone"><input id="address" placeholder="Delivery address"><input id="area" placeholder="Delivery area"><select id="courier"><option value="">Select courier</option><option>Bykea</option><option>Leopards</option><option>TCS</option><option>M&P</option><option>Skynet</option><option>Quick Feet</option><option>Kourier.pk</option><option>Star Delivery</option></select></div><div class="box"><p>Product subtotal: <b id="sub">PKR 0</b></p><p>Delivery estimate: <b id="del">PKR —</b></p><p class="muted">Retail delivery uses verified/admin courier rates; no hard-coded public rate is assumed.</p><p class="total">Estimated total: <span id="total">PKR 0</span></p><button onclick="place()">Place Order</button><p id="msg"></p></div><script>(function(){const cart=JSON.parse(localStorage.getItem("fm-cart")||"[]");const sub=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById("sub").textContent="PKR "+sub;function estimate(){const rates=JSON.parse(localStorage.getItem("fm-delivery-rates")||"[]");const c=document.getElementById("courier").value,a=document.getElementById("area").value.toLowerCase();let matches=rates.filter(x=>x.courier===c&&(!a||x.area.toLowerCase().includes(a)));let rate=matches.length?Math.min(...matches.map(x=>+x.rate)):null;document.getElementById("del").textContent=rate===null?"Pending verified rate":"PKR "+rate;document.getElementById("total").textContent=rate===null?"PKR "+sub:"PKR "+(sub+rate);return rate}document.getElementById("courier").onchange=estimate;document.getElementById("area").oninput=estimate;window.place=function(){if(!cart.length){document.getElementById("msg").textContent="Cart is empty.";return}const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim();if(!name||!phone||!address){document.getElementById("msg").textContent="Name, phone and address are required.";return}const rate=estimate(),o={id:"ORD-"+Date.now(),customer:{name,phone,address,area:document.getElementById("area").value},items:cart,delivery:{courier:document.getElementById("courier").value,estimated_cost:rate},status:"Pending",createdAt:new Date().toISOString()};const k="fm-orders";localStorage.setItem(k,JSON.stringify([o,...JSON.parse(localStorage.getItem(k)||"[]")]));localStorage.setItem("fm-cart","[]");document.getElementById("msg").textContent="Order "+o.id+" created. Delivery cost will be confirmed if no verified rate exists.";};estimate()})()</script></body></html>
