<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM Gifts & Luxury Watches — Product</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:24px}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px}.gallery img{width:100%;max-height:480px;object-fit:contain;border:1px solid #ddd;border-radius:12px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:70px;height:70px;object-fit:contain;border:1px solid #ddd;border-radius:8px}.price{font-size:24px;font-weight:700}.muted{color:#666}.btn{padding:12px 18px;margin:8px 8px 0 0;cursor:pointer}@media(max-width:700px){.wrap{grid-template-columns:1fr}}</style></head><body><p><a href="/shop/catalog.html">← Catalog</a></p><div id="app"></div><script>(function(){const q=new URLSearchParams(location.search),sku=q.get("sku"),products=JSON.parse(localStorage.getItem("fm-products")||"[]"),media=JSON.parse(localStorage.getItem("fm-product-media")||"[]"),p=products.find(x=>x.sku===sku&&x.status==="Active"),root=document.getElementById("app");if(!p){root.innerHTML="<h1>Product not found</h1><p class='muted'>Only approved and published products are available.</p>";return}const imgs=media.filter(x=>x.sku===p.sku&&x.type==="Image"),price=p.price;root.innerHTML="<div class='wrap'><section class='gallery'>"+(imgs[0]?"<img id='hero' src='"+imgs[0].url+"' alt='"+(imgs[0].alt||p.name)+"'>":"<div class='muted'>No product image</div>")+"<div class='thumbs'>"+imgs.map(x=>"<img src='"+x.url+"' alt='"+(x.alt||p.name)+"' onclick='document.getElementById("hero").src=this.src'>").join("")+"</div></section><section><h1>"+p.name+"</h1><p>"+(p.brand||"")+" · "+(p.category||"")+"</p><p class='price'>PKR "+price+"</p><p><b>SKU:</b> "+p.sku+"</p><p>"+(p.description||"Product details are maintained by admin.")+"</p><button class='btn' onclick='alert("Buy Now: "+p.sku+"")'>Buy Now</button><button class='btn' onclick='alert("Added to cart: "+p.sku+"")'>Add to Cart</button></section></div>"})()</script></body></html>
